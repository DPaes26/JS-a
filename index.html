<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <!-- Script necessário para os ícones <box-icon> renderizarem -->
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
</head>

<body>

    <div class="container">

        <div class="imagem">
            <img src="img.jpg" alt="imagem inicial">
        </div>


        <h1>Primeiro linktree</h1>
        <h6>@DaniellyPaes</h6>

        <ul>
            <li>
                <a href="#">
                    <box-icon type="logo" name="instagram"></box-icon>
                </a>
            </li>

            <li>
                <a href="#">
                    <box-icon name="linkedin" type="logo"></box-icon>
                </a>
            </li>

            <li>
                <a href="#">
                    <box-icon name="twitter" type="logo"></box-icon>
                </a>
            </li>
        </ul>


        <div class="buttons">
            <a href="">Link 1</a>
            <a href="">Link 2</a>
            <a href="">Link 3</a>
        </div>

    </div>


</body>

</html>
